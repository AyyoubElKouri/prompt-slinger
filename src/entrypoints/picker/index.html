<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose prompt folder</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1d1f18;
        color: #e6e4d6;
        font-family: Georgia, serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        width: min(480px, 100%);
        padding: 32px;
        background: #262922;
        border: 1px solid #3a3e2f;
        border-radius: 6px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 400;
      }
      p {
        margin: 0 0 24px;
        color: #a3a692;
        font-size: 15px;
        line-height: 1.5;
      }
      button {
        padding: 10px 18px;
        border: 1px solid #c9b77b;
        border-radius: 3px;
        background: transparent;
        color: #c9b77b;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background: #1d1f18;
      }
      button:focus-visible {
        outline: 2px solid #c9b77b;
        outline-offset: 2px;
      }
      #status {
        margin: 20px 0 0;
        color: #a3a692;
      }
      #status.error {
        color: #d4a373;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Choose prompt folder</h1>
      <p>
        Pick the folder that contains your Markdown prompts. Subfolders are
        scanned too. The extension only reads files.
      </p>
      <button id="choose" type="button">Choose folder</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
